# Terminal voor de kinderkamer. De app zet zelf de kleuren van het gekozen thema.
font=JetBrains Mono:size=11
pad=6x6

[colors]
background=1a1b26
foreground=c0caf5

[key-bindings]
# geen nieuwe vensters of andere uitwegen uit de app
spawn-terminal=none
search-start=none
show-urls-launch=none
pipe-visible=none
pipe-scrollback=none
pipe-selected=none
