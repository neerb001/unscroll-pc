# Terminal for Unscroll. The app sets the colours of the chosen theme itself.
font=JetBrains Mono:size=11
pad=6x6

[colors]
background=1a1b26
foreground=c0caf5

[key-bindings]
# no new windows or other ways out of the app
spawn-terminal=none
search-start=none
show-urls-launch=none
pipe-visible=none
pipe-scrollback=none
pipe-selected=none
