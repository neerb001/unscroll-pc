# Settings for parents. This file belongs to root:
# the child can read it but not change it.
# Location on the device: /etc/unscroll/ouders.yaml
# Easiest way to change it: sudo unscroll-ouder

avondslot:
  schooldagen: "20:00"     # Sunday to Thursday
  weekend: "20:30"         # Friday and Saturday evening
  open: "07:00"            # everything opens again from this time
  lezen_mag: true          # e-books stay available during quiet time
  luisterboek_mag: true    # audiobook with sleep timer stays available

# PIN for parent mode (set it with sudo unscroll-ouder), or create the hash with:
#   unscroll --pin-hash 1234
pin_sha256: ""

max_volume: 70

# Radio stations on the dial. Leave this out to use the built-in list
# (NPO Radio 1, NPO Radio 2, NPO 3FM, NPO Klassiek, BBC World Service).
# radio:
#   - naam: "NPO Radio 2"
#     url: "https://icecast.omroep.nl/radio2-bb-mp3"
#   - naam: "BBC World Service"
#     url: "https://stream.live.vc.bbcmedia.co.uk/bbc_world_service"

# "Ask for help" sends a notification to your phones via ntfy.
# Pick a long, hard to guess topic and subscribe to it in the ntfy app.
ntfy:
  url: "https://ntfy.sh"
  topic: ""

# Limits of the AI buddy.
# Leave out a line to use the default from the app;
# defaults are tuned through updates as we learn from real use.
maatje:
  aan: true
  huiswerk_sessies_per_dag: 2      # one session is about one assignment
  beurten_per_huiswerksessie: 40
  verhaal_sessies_per_dag: 1
  beurten_per_verhaalsessie: 30
  vrije_vragen_per_dag: 15         # separate "how does it work?" questions
  max_minuten_per_dag: 45
  pauze_na_minuten: 20             # then a 10 minute break
  leeftijd: 11                     # so the buddy talks at the right level
  # model: "claude-opus-5-5"       # the model that answers (default); cheaper: claude-sonnet-5-5 or claude-haiku-5-5
  # controle_model: "claude-haiku-5-5"  # the fast model that checks every question and answer
