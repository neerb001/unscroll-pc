name: bouwen en uitbrengen

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
      - run: go vet ./...
      - run: go test ./...
      - name: shellcheck
        working-directory: .
        run: shellcheck install.sh scripts/eee-sessie scripts/eee-update

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
      - name: bouwen voor 32-bit, 64-bit en ARM
        working-directory: app
        run: |
          # 386: oude netbooks · amd64: gewone laptops · arm64: Raspberry Pi 4/5/400/500 · arm: oudere Pi's
          for arch in 386 amd64 arm64 arm; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch GOARM=7 go build -trimpath \
              -ldflags "-s -w -X main.versie=${GITHUB_REF_NAME}" -o ../dist/eee-linux-$arch .
            (cd ../dist && sha256sum eee-linux-$arch > eee-linux-$arch.sha256)
          done
      - name: release maken
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRE=""
          [[ "$GITHUB_REF_NAME" == *-* ]] && PRE="--prerelease"
          gh release create "$GITHUB_REF_NAME" dist/* --generate-notes $PRE
