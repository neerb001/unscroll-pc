name: bouwen en uitbrengen

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
      - run: go vet ./...
      - run: go test ./...
      - name: shellcheck
        working-directory: .
        run: shellcheck install.sh scripts/unscroll-sessie scripts/unscroll-update scripts/unscroll-ouder
      - name: geen geheimen in de repository
        working-directory: .
        run: |
          if git ls-files | grep -E '(^|/)(geheimen\.env|ouders\.yaml|update\.conf)$'; then
            echo "Echte instellingen of geheimen gevonden. Die horen alleen op het apparaat."; exit 1
          fi
          if git grep -nE '(sk-ant-[A-Za-z0-9_-]{10,}|ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|xox[bp]-[A-Za-z0-9-]{10,})'; then
            echo "Iets dat op een sleutel of token lijkt staat in de code."; exit 1
          fi

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
      - name: bouwen voor 32-bit, 64-bit en ARM
        working-directory: app
        run: |
          # 386: oude netbooks · amd64: gewone laptops · arm64: Raspberry Pi 4/5/400/500 · arm: oudere Pi's
          for arch in 386 amd64 arm64 arm; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch GOARM=7 go build -trimpath \
              -ldflags "-s -w -X main.versie=${GITHUB_REF_NAME}" -o ../dist/unscroll-linux-$arch .
            (cd ../dist && sha256sum unscroll-linux-$arch > unscroll-linux-$arch.sha256)
          done
      - name: release maken
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRE=""
          [[ "$GITHUB_REF_NAME" == *-* ]] && PRE="--prerelease"
          gh release create "$GITHUB_REF_NAME" dist/* --generate-notes $PRE
